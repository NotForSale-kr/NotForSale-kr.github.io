<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NotForSale</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#111;--sub:#777}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1b1e24;--tx:#f2f2f2;--sub:#999}}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif}
.wrap{max-width:420px;margin:0 auto;padding:40px 16px}
h1{font-size:22px;margin:0 0 20px}
a{display:block;background:var(--card);color:var(--tx);text-decoration:none;border-radius:16px;padding:18px;margin-bottom:10px;font-size:18px;font-weight:700}
a small{display:block;font-size:13px;font-weight:400;color:var(--sub);margin-top:4px}
p{font-size:12px;font-weight:600;color:var(--sub);text-align:center;margin-top:24px}
</style>
</head>
<body>
<div class="wrap">
  <h1>NotForSale 앱</h1>
  <a href="/FX/">환율<small>실시간 환율 · 송금 환율 · 코인 원화가격</small></a>
  <a href="/stock/">주식<small>관심종목 시세를 한눈에</small></a>
  <p>Made by NotForSale</p>
</div>
</body>
</html>
