<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>번역</title>
<meta name="theme-color" content="#f4f5f7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#111;--sub:#777;--ac:#3d5afe;--line:#e6e8ee}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1b1e24;--tx:#f2f2f2;--sub:#999;--ac:#8796ff;--line:#2a2e36}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:12px 12px 40px}
header{display:flex;align-items:center;gap:8px;margin:6px 4px 12px}
h1{flex:1;margin:0;font-size:22px}
button{font:inherit;font-size:13px;color:inherit;border:0;background:var(--card);border-radius:99px;padding:8px 12px}
#st{font-size:12px;color:var(--sub)}
.langs{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.langs select{flex:1;appearance:none;-webkit-appearance:none;border:0;background:var(--card);color:var(--tx);font:600 16px system-ui,sans-serif;text-align:center;text-align-last:center;padding:12px;border-radius:14px}
#swap{font-size:18px;padding:10px 14px;border-radius:14px}
.card{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:10px;position:relative}
textarea{display:block;width:100%;min-height:120px;border:0;outline:none;resize:none;background:none;color:var(--tx);font:20px/1.5 system-ui,sans-serif;padding:0 28px 0 0}
#clear{position:absolute;top:10px;right:10px;background:none;font-size:16px;color:var(--sub);padding:4px 8px}
#out{min-height:60px;font-size:20px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
#out.ph{color:var(--sub)}
#out.err{color:#e5484d;font-size:15px}
.acts{display:flex;gap:8px;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.acts button{background:var(--bg)}
.inst{display:flex;align-items:center;gap:8px;background:var(--ac);color:#fff;border-radius:16px;padding:12px 12px 12px 14px;margin-bottom:10px;font-size:14px;line-height:1.4}
.inst b{flex:1;font-weight:600}
.inst button{background:#fff;color:var(--ac);font-weight:700;font-size:14px}
.inst .x{background:none;color:#fff;padding:4px 6px}
.share{display:flex;gap:8px;margin:4px 0 12px}
.share button{flex:1;padding:12px;font-size:14px;border-radius:14px}
.note{font-size:11px;color:var(--sub);text-align:center;line-height:1.6}
.by{font-size:12px;font-weight:600;color:var(--sub);text-align:center;margin:18px 0 0;letter-spacing:.03em}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(20,22,28,.94);color:#fff;font-size:13.5px;padding:10px 16px;border-radius:14px;max-width:90vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>번역</h1>
    <span id="st"></span>
  </header>
  <div class="inst" id="inst" hidden><b id="instTxt"></b><button id="instBtn" hidden>설치</button><button class="x" id="instX" aria-label="닫기">✕</button></div>
  <div class="langs">
    <select id="src" aria-label="입력 언어"></select>
    <button id="swap" aria-label="언어 바꾸기">⇄</button>
    <select id="tgt" aria-label="번역 언어"></select>
  </div>
  <div class="card">
    <textarea id="in" placeholder="번역할 내용을 입력하세요" autocomplete="off" spellcheck="false"></textarea>
    <button id="clear" aria-label="지우기" hidden>✕</button>
  </div>
  <div class="card">
    <div id="out" class="ph">번역 결과가 여기에 바로 나와요</div>
    <div class="acts">
      <button id="copy">📋 복사</button>
      <button id="speak">🔊 듣기</button>
      <button id="reply" hidden>✍️ 답장 쓰기</button>
    </div>
  </div>
  <div class="share">
    <button id="shareNow">📤 번역 공유</button>
    <button id="shareApp">🔗 앱 공유</button>
  </div>
  <p class="note">입력을 멈추면 바로 번역돼요<br>채팅앱에서 메시지 공유 → '번역'을 고르면 바로 번역돼요<br>AI 번역이라 중요한 내용은 한 번 더 확인하세요</p>
  <p class="by">Made by NotForSale</p>
</div>
<div id="toast"></div>
<script>
var API = "https://fx.woong300.workers.dev";
var LANGS = [["ko","한국어","ko-KR"],["en","영어","en-US"],["ja","일본어","ja-JP"],["zh","중국어","zh-CN"],["es","스페인어","es-ES"],
  ["fr","프랑스어","fr-FR"],["de","독일어","de-DE"],["vi","베트남어","vi-VN"],["th","태국어","th-TH"],["id","인도네시아어","id-ID"],
  ["ru","러시아어","ru-RU"],["it","이탈리아어","it-IT"],["pt","포르투갈어","pt-PT"]];
var $ = function(id){ return document.getElementById(id); };
function get(k, d){ try { var v = localStorage.getItem("tr." + k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }
function put(k, v){ try { localStorage.setItem("tr." + k, JSON.stringify(v)); } catch(e){} }
var src = get("src", "ko"), tgt = get("tgt", "en"), result = "", cache = {}, seq = 0, timer = null;

// ----- 언어 선택 -----
function fill(sel, val){ sel.innerHTML = LANGS.map(function(l){ return '<option value="' + l[0] + '"' + (l[0] === val ? " selected" : "") + ">" + l[1] + "</option>"; }).join(""); }
fill($("src"), src); fill($("tgt"), tgt);
$("src").onchange = function(){ src = this.value; if (src === tgt) { tgt = src === "ko" ? "en" : "ko"; fill($("tgt"), tgt); } put("src", src); put("tgt", tgt); now(); };
$("tgt").onchange = function(){ tgt = this.value; if (src === tgt) { src = tgt === "ko" ? "en" : "ko"; fill($("src"), src); } put("src", src); put("tgt", tgt); now(); };
$("swap").onclick = function(){
  var t = src; src = tgt; tgt = t; fill($("src"), src); fill($("tgt"), tgt); put("src", src); put("tgt", tgt);
  if (result) { $("in").value = result; grow(); }
  now();
};

// ----- 언어 자동 감지 (공유·붙여넣기 할 때) -----
var LATIN = ["en","es","fr","de","vi","id","it","pt"];
function setLangs(s, t){ src = s; tgt = t; fill($("src"), src); fill($("tgt"), tgt); put("src", src); put("tgt", tgt); }
function guess(t){
  function c(re){ return (t.match(re) || []).length; }
  var n = {ko:c(/[가-힣ㄱ-ㅎㅏ-ㅣ]/g) * 3, kana:c(/[\u3040-\u30ff]/g) * 3, han:c(/[\u4e00-\u9fff]/g) * 3,
           th:c(/[\u0e00-\u0e7f]/g), ru:c(/[\u0400-\u04ff]/g), lat:c(/[A-Za-z\u00c0-\u024f\u1ea0-\u1ef9]/g)};
  var best = null, max = 0;
  for (var k in n) if (n[k] > max) { max = n[k]; best = k; }
  if (!best) return null;
  if (best === "kana" || (best === "han" && n.kana)) return "ja";
  if (best === "han") return "zh";
  if (best !== "lat") return best;
  if (/[ăđơưạảấầẩẫậắằẳẵặẹẻẽếềểễệỉịọỏốồổỗộớờởỡợụủứừửữựỳỵỷỹ]/i.test(t)) return "vi";
  if (/[¿¡ñ]/i.test(t)) return "es";
  if (/[ßäöü]/i.test(t)) return "de";
  if (/[ãõ]/i.test(t)) return "pt";
  if (/[çœèëîïû]/i.test(t)) return "fr";
  var f = src !== "ko" ? src : tgt;
  return LATIN.indexOf(f) >= 0 && f !== "vi" ? f : "en";
}
function auto(t){
  var g = guess(t); if (!g || g === src) return;
  if (g === "ko") setLangs("ko", src);          // 한글이 들어오면 지금 외국어로
  else setLangs(g, "ko");                       // 외국어가 들어오면 한국어로
}
$("reply").onclick = function(){                // 받은 말을 읽고 → 한글로 답장 쓰기
  setLangs("ko", src); $("in").value = ""; grow(); go(""); $("in").focus();
};

// ----- 입력하는 동안 번역 -----
function grow(){ var t = $("in"); t.style.height = "auto"; t.style.height = Math.max(120, t.scrollHeight) + "px"; $("clear").hidden = !t.value; }
function show(text, cls){ var o = $("out"); o.textContent = text; o.className = cls || ""; $("reply").hidden = !(result && tgt === "ko" && src !== "ko"); }
function status(t){ $("st").textContent = t || ""; }
function now(){ clearTimeout(timer); go($("in").value); }
function go(q){
  put("q", q);
  if (!q.trim()) { result = ""; seq++; status(""); show("번역 결과가 여기에 바로 나와요", "ph"); return; }
  var key = src + ">" + tgt + ":" + q;
  if (cache[key] != null) { result = cache[key]; show(result); status(""); return; }
  var my = ++seq; status("번역 중…");
  Promise.race([
    fetch(API + "/translate", {method:"POST", headers:{"Content-Type":"text/plain"}, body:JSON.stringify({q:q, src:src, tgt:tgt})}).then(function(r){ return r.json(); }),
    new Promise(function(_, no){ setTimeout(function(){ no("timeout"); }, 20000); })
  ]).then(function(j){
    if (my !== seq) return;                       // 더 최근 입력이 있으면 버림
    status("");
    if (j.error) { result = ""; show(j.error === "limit" ? "오늘 무료 번역 사용량을 다 썼어요. 내일 다시 쓸 수 있어요" : "번역이 안 됐어요. 잠시 후 다시 시도해 주세요", "err"); return; }
    result = j.t || ""; cache[key] = result; show(result);
  })["catch"](function(){
    if (my !== seq) return;
    status(""); result = ""; show("인터넷 연결을 확인해 주세요", "err");
  });
}
$("in").oninput = function(){ grow(); clearTimeout(timer); var q = this.value; timer = setTimeout(function(){ go(q); }, 450); };
$("in").onpaste = function(){
  if (this.value) return;                       // 빈 칸에 붙여넣을 때만 언어 자동 맞춤
  var t = this; setTimeout(function(){ clearTimeout(timer); auto(t.value); go(t.value); }, 0);
};
$("clear").onclick = function(){ $("in").value = ""; grow(); go(""); $("in").focus(); };

// ----- 복사 · 듣기 -----
var toastT;
function toast(m){ var t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove("show"); }, 2200); }
$("copy").onclick = function(){
  if (!result) return toast("복사할 번역이 없어요");
  if (navigator.clipboard) navigator.clipboard.writeText(result).then(function(){ toast("복사됐어요"); }, function(){ toast("복사가 안 되는 환경이에요"); });
  else toast("복사가 안 되는 환경이에요");
};
if (!("speechSynthesis" in window)) $("speak").hidden = true;
$("speak").onclick = function(){
  if (!result) return toast("들을 번역이 없어요");
  try {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(result);
    u.lang = LANGS.filter(function(l){ return l[0] === tgt; })[0][2]; u.rate = 0.95;
    speechSynthesis.speak(u);
  } catch(e){ toast("이 기기에서는 듣기가 안 돼요"); }
};

// ----- 공유 -----
var APP_URL = /github\.io$/.test(location.host) ? location.origin + location.pathname.replace(/index\.html$/, "") : "https://notforsale-kr.github.io/translate/";
function share(data, btn){
  var label = btn.textContent;
  function flash(msg){ btn.textContent = msg; setTimeout(function(){ btn.textContent = label; }, 1800); }
  if (navigator.share) { navigator.share(data)["catch"](function(){}); return; }
  var txt = data.text + "\n" + data.url;
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(function(){ flash("복사됐어요"); }, function(){ flash("공유가 안 되는 환경이에요"); });
  else flash("공유가 안 되는 환경이에요");
}
$("shareNow").onclick = function(){
  if (!result) return toast("공유할 번역이 없어요");
  share({title:"번역", text:$("in").value.trim() + "\n→ " + result, url:APP_URL}, this);
};
$("shareApp").onclick = function(){
  share({title:"번역", text:"입력하면 바로 번역되는 앱이에요. 링크를 열고 '설치'를 누르면 바로 깔려요.", url:APP_URL}, this);
};

// ----- 설치 안내 (공유받은 링크로 처음 열었을 때) -----
var IN_FRAME = window.self !== window.top;
function inApp(ua){ return /KAKAOTALK/i.test(ua) ? "kakao" : /NAVER\(inapp|Instagram|FBAN|FBAV|Line\/|DaumApps|everytimeApp/i.test(ua) ? "other" : ""; }
var UA = navigator.userAgent, IA = inApp(UA), deferred = null;
var INSTALLED = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
if (!INSTALLED && !IN_FRAME && IA === "kakao") location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(location.href);
function showInst(txt, btn){
  if (INSTALLED || IN_FRAME || get("instX", 0)) return;
  $("instTxt").textContent = txt; $("instBtn").hidden = !btn; $("inst").hidden = false;
}
if (IA) showInst("오른쪽 위 메뉴에서 '다른 브라우저로 열기'를 누르면 앱으로 설치할 수 있어요");
else if (/iPhone|iPad/.test(UA)) showInst("아래 공유 버튼(□↑) → '홈 화면에 추가'를 누르면 앱으로 설치돼요");
else if (/SamsungBrowser/.test(UA)) showInst("메뉴(≡) → '페이지 추가' → '홈 화면'을 누르면 앱으로 설치돼요");
else if (/Android/.test(UA)) setTimeout(function(){ if (!deferred) showInst("메뉴(⋮) → '앱 설치'를 누르면 앱으로 설치돼요"); }, 3000);
window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); deferred = e; showInst("홈 화면에 앱으로 설치할 수 있어요", true); });
$("instBtn").onclick = function(){ if (deferred) { deferred.prompt(); deferred = null; } $("inst").hidden = true; };
$("instX").onclick = function(){ $("inst").hidden = true; put("instX", 1); };
window.addEventListener("appinstalled", function(){ $("inst").hidden = true; });

try { if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js")["catch"](function(){}); } catch(e){}
// 다른 앱에서 공유받은 글이 있으면 그걸 번역
var P = new URLSearchParams(location.search), shared = (P.get("text") || P.get("title") || "").trim();
if (shared) { history.replaceState(null, "", location.pathname); $("in").value = shared; grow(); auto(shared); go(shared); }
else { $("in").value = get("q", ""); grow(); if ($("in").value.trim()) go($("in").value); }
</script>
</body>
</html>
